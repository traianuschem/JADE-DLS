# Deterministic CI: pytest + coverage (information only, no gate yet; gate = backlog step 4c).
# No secrets, no LLM actions. Qt/Matplotlib run headless.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Fast suite (excludes @pytest.mark.slow) on every push / pull request.
  test-fast:
    name: fast tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Matches requires-python (>=3.10) in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Runtime dependencies come from pyproject.toml ([project].dependencies); test tools are added here.
      # GUI extras (PyQt5) are not needed by the current headless tests; if GUI tests are added on Linux,
      # add: sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0
      #      libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "coverage[toml]"
          python -m pip list

      - name: Pytest (fast, without slow)
        run: python -m pytest -q -m "not slow"

      - name: Coverage run (fast suite, informational)
        run: python -m coverage run -m pytest -q -m "not slow"

      - name: Coverage report (informational, no gate)
        run: |
          python -m coverage report --skip-empty
          echo "---- ade_dls/analysis ----"
          python -m coverage report --skip-empty --include="ade_dls/analysis/*"
          echo "---- ade_dls/core ----"
          python -m coverage report --skip-empty --include="ade_dls/core/*"
          python -m coverage xml -o coverage-fast.xml
          python -m coverage html -d htmlcov-fast

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage-fast.xml
            htmlcov-fast/
          if-no-files-found: ignore
          retention-days: 30

  # Lower bounds of the declared dependencies (pyproject.toml): guards against raising code requirements
  # (e.g. newer SciPy/NumPy API) without raising the declared minimum versions.
  test-min-versions:
    name: fast tests at minimum dependency versions (ubuntu-latest, py3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install "numpy==2.0.2" "scipy==1.15.0" "pandas==2.2.3" "matplotlib==3.9.4"             "scikit-learn==1.5.2" "statsmodels==0.14.4" "joblib==1.4.2"
          python -m pip list

      - name: Pytest (fast, without slow)
        run: python -m pytest -q -m "not slow"

  # GUI-dependent tests (dialog defaults, previews, widgets, Qt pipeline wrapper): skipped in test-fast because
  # PyQt5 is not installed there. Windows runner: the PyQt5 wheels run offscreen without system packages.
  test-gui:
    name: fast tests with PyQt5 (windows-latest, py3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . PyQt5 pytest
          python -m pip list

      - name: Pytest (fast, with GUI tests)
        run: python -m pytest -q -m "not slow"

  # Full suite including slow tests (NNLS/Regularized fits, synthetic-benchmark parity: ~20 min locally): only on
  # main or manual dispatch.
  test-full:
    name: full tests incl. slow (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "coverage[toml]"
          python -m pip list

      # `coverage run -m pytest -q` is the full `python -m pytest -q` (all markers incl. slow) under coverage.
      - name: Pytest full suite under coverage
        run: python -m coverage run -m pytest -q

      - name: Coverage report (informational, no gate)
        if: always()
        run: |
          python -m coverage report --skip-empty
          echo "---- ade_dls/analysis ----"
          python -m coverage report --skip-empty --include="ade_dls/analysis/*"
          echo "---- ade_dls/core ----"
          python -m coverage report --skip-empty --include="ade_dls/core/*"
          python -m coverage xml -o coverage-full.xml
          python -m coverage html -d htmlcov-full

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full-${{ matrix.os }}
          path: |
            coverage-full.xml
            htmlcov-full/
          if-no-files-found: ignore
          retention-days: 90
